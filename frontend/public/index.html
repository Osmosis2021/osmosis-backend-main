  <style>
    /* Splash while the app loads. React replaces everything inside #root when it starts. */
    html { background: #FFFFFF; }
    .st-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #FFFFFF; opacity: 0; animation: st-splash-in .3s ease-out .25s forwards; }
    .st-splash svg { width: 88px; height: 88px; overflow: visible; transform-origin: 50% 85%; animation: st-float 3.2s ease-in-out infinite; }
    .st-splash .eyes { transform-box: fill-box; transform-origin: center; animation: st-blink 4.5s ease-in-out infinite; }
    @keyframes st-splash-in { to { opacity: 1; } }
    @keyframes st-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6%); } }
    @keyframes st-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @media (prefers-reduced-motion: reduce) { .st-splash svg, .st-splash .eyes { animation: none; } }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="st-splash" role="status" aria-label="Loading Studio Time">
      <svg viewBox="0 0 256 256" fill="none" aria-hidden="true">
        <path d="M43 83 L111 46 L213 67 L145 104 Z" fill="#F8F7F4" stroke="#111318" stroke-width="10" stroke-linejoin="round"/>
        <path d="M43 83 L111 46 L111 211 L43 184 Z" fill="#F1F0EC" stroke="#111318" stroke-width="10" stroke-linejoin="round"/>
        <path d="M111 46 L213 67 L213 188 L111 211 Z" fill="#FFFFFF" stroke="#111318" stroke-width="10" stroke-linejoin="round"/>
        <path d="M133 94 L193 83 L193 177 L133 188 Z" fill="#F8F7F4" stroke="#111318" stroke-width="7" stroke-linejoin="round"/>
        <g class="eyes">
          <rect x="148" y="127" width="8" height="20" rx="4" fill="#111318"/>
          <rect x="172" y="127" width="8" height="20" rx="4" fill="#111318"/>
        </g>
      </svg>
    </div>
  </div>
</body>
